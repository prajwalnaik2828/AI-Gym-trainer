<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Gym Trainer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- App Design Styles -->
    <link href="{{ url_for('staticfiles', filename='styles.css') }}" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
          <span class="brand-icon-box">
            <i class="bi bi-activity"></i>
          </span>
          <span class="brand-title-text">AI Gym Trainer</span>
        </a>
        <div class="d-flex align-items-center gap-3">
          {% if session.get('user') %}
            <span class="d-none d-md-inline-flex align-items-center gap-2 small text-secondary">
              <i class="bi bi-person-circle fs-6 text-info"></i>
              <span>{{ session.get('user') }}</span>
            </span>
            <a class="btn-nav-logout" href="{{ url_for('logout') }}">
              <i class="bi bi-box-arrow-right"></i>
              <span>Logout</span>
            </a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container my-4">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
