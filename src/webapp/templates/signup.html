{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 shadow-card">
      <div class="d-flex align-items-center gap-2 mb-2">
        <span class="icon-circle"><i class="bi bi-person-plus"></i></span>
        <h3 class="mb-0">Join AI Gym</h3>
      </div>
      <div class="muted mb-3">Create your account to start training</div>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post">
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input class="form-control" name="full_name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" type="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" name="password" type="password" required>
        </div>
        <button class="btn btn-gradient w-100" type="submit"><i class="bi bi-person-check me-1"></i>Sign up</button>
      </form>
      <div class="text-center mt-3">
        <a class="text-white" href="{{ url_for('login') }}">Back to login</a>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
