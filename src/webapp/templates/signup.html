{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-ambient-glow"></div>
  <div class="card shadow-card auth-card">
    <div class="text-center">
      <div class="auth-badge">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join AI Gym Trainer for real-time rep counting and form coaching</p>
    </div>

    {% if error %}
      <div class="alert alert-danger py-2 d-flex align-items-center gap-2 mb-3" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-radius: 12px;">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <div class="mb-3">
        <label class="form-label d-flex align-items-center gap-2">
          <i class="bi bi-person text-info"></i>
          <span>Full Name</span>
        </label>
        <input class="form-control" name="full_name" placeholder="e.g. Alex Johnson" required autocomplete="name">
      </div>
      <div class="mb-3">
        <label class="form-label d-flex align-items-center gap-2">
          <i class="bi bi-envelope text-info"></i>
          <span>Email Address</span>
        </label>
        <input class="form-control" name="email" type="email" placeholder="name@example.com" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label d-flex align-items-center gap-2">
          <i class="bi bi-lock text-info"></i>
          <span>Password</span>
        </label>
        <input class="form-control" name="password" type="password" placeholder="Create a strong password" required autocomplete="new-password">
      </div>
      <button class="btn btn-gradient w-100 py-3 mb-3" type="submit">
        <i class="bi bi-check2-circle"></i>
        <span>Create My Free Account</span>
      </button>
    </form>

    <div class="text-center pt-2" style="border-top: 1px solid var(--border-subtle);">
      <span class="text-secondary small">Already have an account? </span>
      <a class="text-info fw-semibold text-decoration-none small" href="{{ url_for('login') }}">Sign In →</a>
    </div>
  </div>
</div>
{% endblock %}
